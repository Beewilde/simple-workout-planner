<html lang="en">
<head>

<meta name="description" content="Offline workout planner">

<title>Workout Planner</title>
<style>
@font-face{font-family:Inter;src:url(fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{--bg:#101311;--sf:#191f1b;--rs:#222a24;--pr:#b6f36b;--pt:#b6f36b;--on:#11170e;--tx:#f4f6f2;--sb:#a0aaa1;--mu:#8b968c;--bd:#303a32;--ok:#76d99a;--wn:#f4c76b;--dg:#f07878;--bl:#7ab8e8;--pa:rgba(182,243,107,.1);--side:#141814;--hov:#1d241f;--inp:#151a16;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5f1;--sf:#fff;--rs:#e9ede7;--pt:#3d6a0f;--tx:#101311;--sb:#445047;--mu:#5d695f;--bd:#d3dad1;--ok:#1f7a45;--wn:#8a5a00;--dg:#b42323;--bl:#1d5f99;--pa:rgba(61,106,15,.1);--side:#fff;--hov:#f0f3ee;--inp:#fff;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f5f1;--sf:#fff;--rs:#e9ede7;--pt:#3d6a0f;--tx:#101311;--sb:#445047;--mu:#5d695f;--bd:#d3dad1;--ok:#1f7a45;--wn:#8a5a00;--dg:#b42323;--bl:#1d5f99;--pa:rgba(61,106,15,.1);--side:#fff;--hov:#f0f3ee;--inp:#fff;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-width:320px;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,p{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
svg{flex:none}
.k-lime{--c:#b6f36b}.k-orange{--c:#f4c76b}.k-blue{--c:#7ab8e8}.k-purple{--c:#b494e8}.k-red{--c:#f07878}
.page{max-width:1180px;margin:0 auto;padding:42px 44px 72px}
.sidebar{position:fixed;inset:0 auto 0 0;width:232px;padding:30px 20px 24px;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--bd);z-index:30}
.app-shell:not(.full) .app-content{margin-left:232px}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 35px;font-weight:800;letter-spacing:.16em}
.bmark{width:36px;height:36px;display:inline-grid;place-items:center;color:var(--on);background:var(--pr);border-radius:10px}
.sidebar nav{display:grid;gap:6px}
.sidebar nav button,.sbot>button{min-height:48px;padding:0 14px;display:flex;align-items:center;gap:13px;color:var(--sb);border-radius:12px;font-weight:600;text-align:left;width:100%}
.sidebar nav button:hover,.sbot>button:hover{background:var(--sf);color:var(--tx)}
.sidebar .on{color:var(--pt)!important;background:var(--pa)}
.sbot{margin-top:auto}
.bnav{display:none}
.screen-header{margin-bottom:28px}.hrow{display:flex;align-items:center;gap:14px}
.tcopy{display:grid;gap:7px;flex:1}
h1{font-size:clamp(25px,3vw,34px);line-height:1.15;letter-spacing:-.035em}
.tcopy p{color:var(--sb)}
.kick,.eyebrow{color:var(--pt);font-size:11px;line-height:1;letter-spacing:.14em;font-weight:800}
.hacts{margin-left:auto;display:flex;gap:8px}
.button{min-height:44px;padding:0 18px;display:inline-flex;justify-content:center;align-items:center;gap:8px;border-radius:12px;font-size:14px;font-weight:700;transition:transform .18s,background .18s,border-color .18s}
.button:active{transform:scale(.98)}
.button-primary{background:var(--pr);color:var(--on)}.button-primary:hover{filter:brightness(1.07)}
.button-secondary{background:var(--rs);border:1px solid var(--bd);color:var(--tx)}.button-secondary:hover{border-color:var(--pt)}
.button-ghost{color:var(--sb)}
.button-danger{background:rgba(240,120,120,.1);color:var(--dg);border:1px solid rgba(240,120,120,.3)}
.button-full{width:100%}.button:disabled{opacity:.4;cursor:not-allowed}
.sm{padding:0 12px;font-size:13px}
.icon-button{width:44px;height:44px;display:inline-grid;place-items:center;color:var(--sb);border-radius:12px}
.icon-button:hover{color:var(--tx);background:var(--rs)}.icon-button.act{color:var(--pt)}
.badge{min-height:24px;padding:4px 8px;display:inline-flex;align-items:center;gap:5px;border-radius:7px;background:var(--rs);color:var(--sb);font-size:12px;line-height:1.2;font-weight:700;white-space:nowrap}
.badge-lime{color:var(--pt);background:var(--pa)}.badge-blue{color:var(--bl);background:rgba(122,184,232,.12)}.badge-orange{color:var(--wn);background:rgba(244,199,107,.12)}.badge-success{color:var(--ok);background:rgba(118,217,154,.12)}
.chip{min-height:44px;padding:0 15px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:var(--sf);color:var(--sb);border:1px solid var(--bd);border-radius:999px;font-size:13px;font-weight:600}
.chip.on{background:var(--pa);color:var(--pt);border-color:var(--pt)}
.search{min-height:46px;padding:0 14px;display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--mu)}
.search:focus-within{border-color:var(--pt)}.search input{min-width:0;flex:1;border:0;outline:0;background:none;min-height:44px;padding:0}
.section{margin-top:35px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px}
.sh>div:first-child{display:grid;gap:7px}.sh h2{font-size:19px;letter-spacing:-.02em}.sh h3{font-size:17px}
.mlabel,.subtle{color:var(--mu);font-size:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.twel{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:12px}
.twel>div{display:grid;gap:9px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--rs);border:1px solid var(--bd);color:var(--pt);font-weight:700}
.hero{position:relative;overflow:hidden;padding:28px;background:var(--sf);border:1px solid var(--bd);border-radius:22px}
.htop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dot{width:6px;height:6px;background:var(--pt);border-radius:50%}
.hcopy{max-width:630px;display:grid;gap:10px;margin:27px 0 24px}
.hcopy h2{font-size:clamp(28px,4vw,42px);line-height:1;letter-spacing:-.045em}.hcopy p{color:var(--sb);line-height:1.55}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.metric{display:flex;align-items:center;gap:10px}
.micon{width:38px;height:38px;display:grid;place-items:center;color:var(--pt);background:var(--pa);border-radius:10px}
.metric>div{display:grid;gap:2px}.metric strong{font-size:14px}.metric small{color:var(--mu);font-size:12px}
.hero>.tags{margin-bottom:24px}
.hacts2{min-height:44px;display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px}
.hacts2 button{min-height:44px;display:flex;align-items:center;gap:6px;color:var(--sb);font-size:13px;font-weight:600}
.hacts2 button:hover{color:var(--tx)}.hacts2 span{width:1px;height:16px;background:var(--bd)}
.exlist{overflow:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:16px}
.exrow{min-height:64px;padding:10px 16px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--bd)}
.num{width:28px;height:28px;display:grid;place-items:center;background:var(--rs);border-radius:8px;color:var(--sb);font-size:12px;font-weight:700}
.excopy{min-width:0;flex:1;display:grid;gap:4px}
.excopy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.excopy span{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:12px}
.excopy i{width:3px;height:3px;background:var(--mu);border-radius:50%}
.mdot{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:rgba(122,184,232,.12);color:var(--bl);font-size:11px;font-weight:800}
.showall{min-height:48px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--pt);font-size:13px;font-weight:700}
.dgrid{margin-top:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.mini{padding:20px;background:var(--sf);border:1px solid var(--bd);border-radius:16px}
.dtile{min-width:46px;padding:6px;display:grid;place-items:center;color:var(--mu);background:var(--rs);border-radius:9px;font-size:10px;letter-spacing:.08em}
.dtile b{color:var(--tx);font-size:16px;letter-spacing:0}
.pcard .sh>strong{color:var(--pt);font-size:20px}
.wdots{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wdots div{display:grid;place-items:center;gap:6px}.wdots span{color:var(--mu);font-size:11px}
.wdots i{width:28px;height:28px;display:grid;place-items:center;color:var(--mu);background:var(--rs);border:1px solid var(--bd);border-radius:50%;font-size:11px;font-style:normal}
.wdots .done i{color:var(--on);background:var(--ok);border-color:var(--ok)}.wdots .today i{color:var(--pt);border-color:var(--pt)}
.ctool{margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.mnav{display:flex;align-items:center;gap:4px}.mnav strong{min-width:130px;text-align:center;font-size:15px}
.seg{padding:3px;display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
.seg button{min-height:40px;padding:0 14px;color:var(--mu);border-radius:7px;font-size:13px;font-weight:700}
.seg .on{color:var(--tx);background:var(--rs)}
.ccard{overflow:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:16px}
.wkd,.cgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.wkd{padding:12px 0;border-bottom:1px solid var(--bd)}.wkd span{color:var(--mu);font-size:11px;font-weight:700;text-align:center}
.cday{min-height:92px;padding:8px;display:flex;flex-direction:column;gap:5px;color:var(--sb);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);text-align:left;overflow:hidden}
.cday:nth-child(7n){border-right:0}.cday:hover{background:var(--hov)}
.cday.sel{background:var(--pa);box-shadow:inset 0 0 0 1px var(--pt)}.cday.out{opacity:.4}
.dn{width:26px;height:26px;display:grid;place-items:center;font-size:12px}
.cur .dn{color:var(--on);background:var(--pr);border-radius:50%;font-weight:800}
.cev{width:100%;padding:3px 5px;display:flex;align-items:center;gap:3px;overflow:hidden;border-left:3px solid var(--c);border-radius:4px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--tx);font-size:11px;white-space:nowrap;text-overflow:ellipsis}
.cev.st-skipped{opacity:.55;text-decoration:line-through}.cev.st-done{border-left-color:var(--ok)}
.more{color:var(--mu);font-size:11px}
.legend{padding:12px 16px;display:flex;justify-content:flex-end;gap:18px}.legend span{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:12px}
.legend i{width:8px;height:8px;border-radius:50%}
.agenda{margin-top:28px}
.acard{padding:16px;display:flex;align-items:center;gap:14px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;flex-wrap:wrap}
.abar{width:4px;height:56px;border-radius:4px;background:var(--c)}
.atime{display:grid;text-align:right;min-width:44px}.atime strong{font-size:15px}.atime span{color:var(--mu);font-size:11px}
.acopy{flex:1;display:grid;gap:5px;min-width:140px}.acopy h3{font-size:15px}.acopy p{color:var(--mu);font-size:12px}.acopy .badge{justify-self:start}
.arow{width:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid var(--bd)}
.arow input{width:auto;flex:1;min-width:130px}
.agenda .acard+.acard{margin-top:10px}
.einl{padding:20px;display:flex;align-items:center;gap:13px;background:var(--sf);border:1px dashed var(--bd);border-radius:16px}
.einl>span{width:40px;height:40px;display:grid;place-items:center;color:var(--mu);background:var(--rs);border-radius:10px}
.einl div{display:grid;gap:4px}.einl p{color:var(--mu);font-size:12px}
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:20px;background:rgba(3,5,4,.74)}
.sheet{width:min(100%,600px);max-height:calc(100vh - 40px);overflow-y:auto;padding:12px 24px 24px;background:var(--sf);border:1px solid var(--bd);border-radius:24px 24px 18px 18px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.handle{width:42px;height:4px;margin:0 auto 18px;background:var(--bd);border-radius:4px}
.stitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.stitle>div{display:grid;gap:7px}.stitle h2{font-size:22px}
.slist{display:grid;gap:8px;margin:14px 0 20px}
.sroute{min-height:66px;padding:10px 12px;display:flex;align-items:center;gap:12px;background:var(--rs);border:1px solid transparent;border-radius:12px;text-align:left;width:100%}
.sroute.on{border-color:var(--pt);background:var(--pa)}
.sroute>i{width:4px;height:35px;border-radius:4px;background:var(--c)}.sroute>span{flex:1;display:grid;gap:4px}.sroute small{color:var(--mu);font-size:12px}.sroute>svg{color:var(--pt)}
label{display:grid;gap:8px;color:var(--sb);font-size:12px;font-weight:600}
label em{color:var(--mu);font-style:normal;font-weight:400}
input,select,textarea{width:100%;border:1px solid var(--bd);border-radius:10px;outline:0;color:var(--tx);background:var(--inp);font-size:14px}
input,select{min-height:44px;padding:0 12px}textarea{padding:12px;line-height:1.55;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pt)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch{position:relative;min-height:66px;margin:16px 0;padding:12px 0;display:flex;align-items:center;gap:10px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);cursor:pointer}
.switch>span{display:grid;flex:1;gap:4px}.switch strong{color:var(--tx);font-size:14px}.switch small{color:var(--mu);font-size:12px;font-weight:400}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch>i{position:relative;width:42px;height:24px;background:var(--bd);border-radius:20px;transition:background .2s}
.switch>i::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s}
.switch input:checked+i{background:var(--pr)}.switch input:checked+i::after{transform:translateX(18px);background:var(--on)}
.switch input:focus-visible+i{outline:2px solid var(--pt);outline-offset:2px}
.flabel{color:var(--sb);font-size:12px;font-weight:600}
.rec{padding:15px;background:var(--rs);border-radius:12px;display:grid;gap:12px}
.wdsel{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wdsel button{min-height:44px;color:var(--sb);background:var(--sf);border:1px solid var(--bd);border-radius:50%;font-size:12px;font-weight:700}
.wdsel .on{color:var(--on);background:var(--pr);border-color:var(--pr)}
.sacts{margin-top:20px;display:flex;justify-content:flex-end;gap:8px}
.okst{padding:16px 10px 4px;display:grid;justify-items:center;gap:12px;text-align:center}
.okc{width:62px;height:62px;display:grid;place-items:center;color:var(--on);background:var(--ok);border-radius:50%}
.okst p{color:var(--sb);margin-bottom:10px}
.ftool{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;align-items:center;gap:14px;margin-bottom:24px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rcard{position:relative;overflow:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:16px}
.rmain{width:100%;padding:20px;display:grid;gap:17px;text-align:left}
.rtop{display:flex;align-items:center}.rtop>svg{margin-left:auto;color:var(--mu)}
.ricon{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;color:#11170e;background:var(--c)}
.rmain h2{margin-bottom:5px;font-size:18px}.rmain p,.eqlabel{color:var(--mu);font-size:12px}
.eqlabel{display:flex;align-items:center;gap:6px}
.ract{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--bd)}
.ract button{min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--sb);border-right:1px solid var(--bd);font-size:12px;font-weight:600}
.ract button:last-child{border-right:0}.ract button:hover{color:var(--pt);background:var(--pa)}
.toast{position:fixed;z-index:120;left:50%;bottom:28px;width:min(360px,calc(100% - 32px));padding:13px 15px;display:flex;align-items:center;gap:11px;transform:translateX(-50%);background:var(--rs);border:1px solid var(--bd);border-radius:13px;box-shadow:0 15px 45px rgba(0,0,0,.4)}
.toast>span{width:28px;height:28px;display:grid;place-items:center;color:var(--on);background:var(--ok);border-radius:50%}
.toast>div{display:grid;gap:3px}.toast small{color:var(--sb);font-size:12px}
.strip{margin-bottom:28px;padding:16px 20px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--sf);border:1px solid var(--bd);border-radius:16px}
.blay{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;align-items:start}
.help{margin:-6px 0 14px;color:var(--mu);font-size:12px}
.blist{display:grid;gap:10px}
.bcard{display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:14px}
.bmv{width:48px;display:grid;align-content:center;justify-items:center;border-right:1px solid var(--bd)}
.bmv .icon-button{width:44px;height:40px}
.bcc{min-width:0;flex:1;padding:14px}
.bt{display:flex;align-items:center;gap:10px}.bt>div{min-width:0;flex:1;display:grid;gap:4px}
.bt h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.bt p{color:var(--mu);font-size:12px}
.sf4{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sf4 label>span{color:var(--mu);font-size:10px;letter-spacing:.08em}.sf4 input{text-align:center;padding:0 6px}

.ssl.on{color:var(--bl);background:rgba(122,184,232,.1);border-style:solid;border-color:transparent}
.adash{width:100%;min-height:58px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--pt);border:1px dashed var(--bd);border-radius:14px;font-weight:700}
.baside{position:sticky;top:24px;padding:18px;display:grid;gap:16px;background:var(--sf);border:1px solid var(--bd);border-radius:16px}
.copts{display:flex;gap:9px}.copts button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--on);background:var(--c)}
.copts .on{box-shadow:0 0 0 2px var(--sf),0 0 0 4px var(--pt)}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:380px;overflow-y:auto}
.sx{min-height:64px;padding:9px;display:flex;align-items:center;gap:10px;background:var(--rs);border:1px solid transparent;border-radius:11px;text-align:left}
.sx.on{border-color:var(--pt);background:var(--pa)}
.glyph{width:38px;height:38px;display:grid;place-items:center;color:var(--pt);background:var(--pa);border-radius:10px}
.sx>span:nth-child(2){min-width:0;flex:1;display:grid;gap:3px}.sx strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.sx small{color:var(--mu);font-size:11px}
.sx>i{width:22px;height:22px;display:grid;place-items:center;color:var(--on);background:var(--bd);border-radius:50%}.sx.on>i{background:var(--pr)}
.sstick{margin-top:15px;padding-top:14px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--bd)}

function parse(t){let eq='No Equipment';const out=[];
t.split('\n').forEach(l=>{l=l.trim();if(!l)return;const hl=l.replace(/[:\-–]+$/,'').trim().toLowerCase();
if(/^(kettlebells?|dumbbells?|no[ -]equipment|bodyweight)$/.test(hl)){eq=/kettle/.test(hl)?'Kettlebell':/dumb/.test(hl)?'Dumbbell':'No Equipment';return}
l=l.replace(/^(?:[-*•]|\d+[.)])\s*/,'');
const sr=/(\d+)\s*[x×]\s*(\d+(?:\s*[-–]\s*\d+)?(?:\s*(?:sec|s|min))?)/i.exec(l),mp=/\(([^)]*)\)/.exec(l),wt=/@\s*(\d+(?:\.\d+)?)\s*(?:kg|lbs?)?/i.exec(l);
const n=l.replace(/\([^)]*\)/,'').replace(wt?wt[0]:'','').replace(sr?sr[0]:'','').replace(/[\s:\-–—,]+$/,'').replace(/^[\s:\-–—]+/,'').trim();if(!n)return;
const mus=mp?mp[1].split(/[,/&]/).map(s=>{s=s.toLowerCase().trim();return s.length<3?'':MU.find(m=>m.toLowerCase().startsWith(s.slice(0,4)))||''}).filter(Boolean):[],d=S.ex.find(e=>e.n.toLowerCase()===n.toLowerCase());
out.push({n,eq,mu:mus[0]||'Full Body',sets:sr?+sr[1]:3,reps:sr?sr[2].replace(/\s+/g,' '):'10',wt:wt?wt[1]:'',dup:d?d.id:'',act:d?'merge':'add'})});return out}

function vSess(){const z=V.sess,r=rtOf(z.rid),its=items(r),i=its[z.ei],e=exOf(i.eid),sets=z.sets[z.ei],lg=S.log[e.id];
return`<div class="sess"><header class="shead">${ib('close','Exit workout','go','data-s="today"')}<div><span>${esc(r.n.toUpperCase())}</span><strong>${z.ei+1} of ${its.length}</strong></div><span style="width:44px"></span></header><div class="sprog"><i style="width:${(z.ei+1)/its.length*100}%"></i></div><main class="scont"><div class="cex"><span class="glyph">${I('dumbbell',26)}</span><span class="kick">CURRENT EXERCISE</span><h1>${esc(e.n)}</h1><p>${esc(e.eq)} · ${esc(e.mu)} · target ${esc(i.sets)} × ${esc(i.reps)}</p></div>
<div class="stab"><div class="sth"><span>SET</span><span>PREVIOUS</span><span>${S.unit.toUpperCase()}</span><span>REPS</span><span></span></div>${sets.map((s,k)=>`<div class="str${s.d?' done':''}"><strong>${k+1}</strong><span>${lg?esc(lg.w||'—')+' × '+esc(lg.r):'—'}</span><input type="number" step="any" min="0" data-f="s:w" data-k="${k}" value="${esc(s.w)}" aria-label="Set ${k+1} weight"><input data-f="s:r" data-k="${k}" value="${esc(s.r)}" aria-label="Set ${k+1} reps"><button data-a="sset" data-k="${k}" aria-pressed="${s.d}" aria-label="Mark set ${k+1} done">${I('check')}</button></div>`).join('')}</div>
<div class="rest"><span>${I('clock')}</span><div><strong>Rest timer</strong><p id="rtx" aria-live="polite">${esc(i.rest||60)} sec after each set</p></div><button data-a="rest" data-s="${+i.rest||60}">Start</button></div>${btn(z.ei===its.length-1?'Finish workout':'Next exercise','snext',{full:1,i:'arrow'})}<button class="skip" data-a="snext">Skip this exercise</button></main></div>`}
function vSum(){const z=V.sum,r=rtOf(V.sess.rid),m=Math.floor(z.dur/60000),s=Math.floor(z.dur/1000)%60;
return`<div class="summ"><div class="schk">${I('check',34)}</div><span class="kick">WORKOUT COMPLETE</span><h1>Strong work, ${esc(S.name)}.</h1><p>You finished ${esc(r.n)}. Consistency is built one session at a time.</p><div class="sstats">${Mx('clock',m+':'+String(s).padStart(2,'0'),'Duration')}${Mx('routines',items(r).length,'Exercises')}${Mx('check',z.sets,'Sets done')}</div><div class="scard"><div><span>Today</span><strong>${esc(r.n)}</strong></div>${B(I('check',13)+' Done','success')}</div>${btn('Save session','ssave',{full:1})}${btn('Discard','go',{v:'ghost',full:1,d:'data-s="today"'})}</div>`}

function pickList(){const z=V.sheet,l=S.ex.filter(e=>(z.f==='All'||e.eq===z.f||e.mu===z.f||(z.f==='Favorites'&&e.fav))&&e.n.toLowerCase().includes((z.q||'').toLowerCase())).sort((a,b)=>a.n.localeCompare(b.n));
return l.map(e=>`<button class="sx${z.sel.includes(e.id)?' on':''}" aria-pressed="${z.sel.includes(e.id)}" data-a="ptog" data-id="${e.id}"><span class="glyph">${I('dumbbell')}</span><span><strong>${esc(e.n)}</strong><small>${esc(e.eq)} · ${esc(e.mu)} · ${esc(e.sets)} × ${esc(e.reps)}</small></span><i>${z.sel.includes(e.id)?I('check',16):''}</i></button>`).join('')||'<p class="mlabel">No exercises match.</p>'}
function sheetH(){const z=V.sheet;let k,t,b;
if(z.t==='add'){k='NEW WORKOUT';t=z.ok?'Workout scheduled':z.step===1?'Choose a routine':'Schedule details';
const r=rtOf(z.rid);
if(z.ok)b=`<div class="okst"><span class="okc">${I('check',28)}</span><h3>${esc(r.n)} is on your calendar</h3><p>${z.count} session${z.count===1?'':'s'} added${z.rep?' · repeats weekly':''}</p>${btn('Done','close',{full:1})}</div>`;
else if(z.step===1)b=S.rt.length?`<div class="slist">${S.rt.map(x=>`<button class="sroute k-${col(x)}${z.rid===x.id?' on':''}" aria-pressed="${z.rid===x.id}" data-a="pickrt" data-id="${x.id}"><i></i><span><strong>${esc(x.n)}</strong><small>${items(x).length} exercises · ${mins(x)} min</small></span>${z.rid===x.id?I('check'):''}</button>`).join('')}</div>${btn('Continue','sstep',{full:1,d:`data-n="2" ${z.rid?'':'disabled'}`})}`:`<p class="help">You have no routines yet.</p>${btn('Create a routine','newrt',{i:'plus'})}`;
else b=`<div class="fg2"><label><span>Date</span><input type="date" data-f="sh:date" value="${z.date}"></label><label><span>Time <em>Optional</em></span><input type="time" data-f="sh:time" value="${z.time}"></label></div><label class="switch"><span><strong>Repeat workout</strong><small>Set a recurring schedule</small></span><input type="checkbox" data-f="sh:rep" ${z.rep?'checked':''}><i></i></label>${z.rep?`<div class="rec"><span class="flabel">Repeat on</span><div class="wdsel">${['M','T','W','T','F','S','S'].map((l,j)=>{const d=[1,2,3,4,5,6,0][j];return`<button class="${z.days.includes(d)?'on':''}" aria-pressed="${z.days.includes(d)}" aria-label="${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][j]}" data-a="dow" data-d="${d}">${l}</button>`}).join('')}</div><label><span>For how many weeks</span><input type="number" min="1" max="52" data-f="sh:weeks" value="${z.weeks}"></label></div>`:''}<div class="sacts">${btn('Back','sstep',{v:'secondary',d:'data-n="1"'})}${btn('Save workout','savesch')}</div>`}
else{k='EXERCISE LIBRARY';t='Add exercises';b=`<label class="search" style="display:flex">${I('search',19)}<input data-f="pq" value="${esc(z.q||'')}" placeholder="Search by name" aria-label="Search by name"></label><div class="chips" style="margin:12px 0">${['All','Favorites',...EQ].map(x=>chipB(x,z.f===x,'pchip',`data-v="${x}"`)).join('')}</div><div class="sel2" id="pl">${pickList()}</div><div class="sstick"><span class="mlabel"><span id="pc">${z.sel.length}</span> selected</span>${btn('Add selected','paddsel')}</div>`}
return`<div class="overlay" data-a="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${t}"><div class="handle"></div><div class="stitle"><div><span class="kick">${k}</span><h2>${t}</h2></div>${ib('close','Close','close')}</div>${b}</div></div>`}

const NAV=[['today','home','Today'],['calendar','calendar','Calendar'],['routines','routines','Routines'],['library','library','Library']];
function render(){const full=V.scr==='session'||V.scr==='summary',act={today:'today',calendar:'calendar',routines:'routines',builder:'routines',library:'library',exform:'library',import:'library',settings:'settings'}[V.scr];
const v={today:vToday,calendar:vCal,routines:vRt,builder:vBuild,library:vLib,exform:vEx,import:vImp,settings:vSet,session:vSess,summary:vSum}[V.scr]();
$('#app').className='app-shell'+(full?' full':'');
$('#app').innerHTML=(full?'':`<aside class="sidebar"><button class="brand" data-a="go" data-s="today"><span class="bmark">${I('dumbbell')}</span><span>FORM</span></button><nav aria-label="Main">${NAV.map(([s,i,l])=>`<button class="${act===s?'on':''}" ${act===s?'aria-current="page"':''} data-a="go" data-s="${s}">${I(i)}<span>${l}</span></button>`).join('')}</nav><div class="sbot"><button class="${act==='settings'?'on':''}" data-a="go" data-s="settings">${I('settings')}<span>Settings</span></button></div></aside><nav class="bnav" aria-label="Main">${NAV.map(([s,i,l])=>`<button class="${act===s?'on':''}" ${act===s?'aria-current="page"':''} data-a="go" data-s="${s}">${I(i)}<small>${l}</small></button>`).join('')}</nav>`)+`<div class="app-content">${v}</div>`;
$('#ov').innerHTML=V.sheet?sheetH():''}

const stopT=()=>{clearInterval(V.tm);V.tm=0};
const A={
go(el){stopT();V.scr=el.dataset.s;V.sheet=null;V.cf='';if(V.scr==='import')V.imp={step:1,notes:'',rows:[],st:{}};scrollTo(0,0)},
sel(el){V.sel=el.dataset.d;const d=pd(V.sel);if(V.cv==='Month'&&d.getMonth()!==V.mo.getMonth())V.mo=new Date(d.getFullYear(),d.getMonth(),1)},
cv(el){V.cv=el.dataset.v},
mo(el){const n=+el.dataset.n;if(V.cv==='Week'){const d=addD(pd(V.sel),7*n);V.sel=iso(d);V.mo=new Date(d.getFullYear(),d.getMonth(),1)}else V.mo=new Date(V.mo.getFullYear(),V.mo.getMonth()+n,1)},
add(el){const d=el.dataset.d||V.sel;V.sheet={t:'add',step:el.dataset.id?2:1,rid:el.dataset.id||'',date:d,time:'18:00',rep:false,days:[pd(d).getDay()],weeks:8,count:0,ok:false}},
close(){V.sheet=null},pickrt(el){V.sheet.rid=el.dataset.id},sstep(el){V.sheet.step=+el.dataset.n},
dow(el){const d=+el.dataset.d,a=V.sheet.days;V.sheet.days=a.includes(d)?a.filter(x=>x!==d):[...a,d]},
savesch(){const z=V.sheet;if(!z.date){toast('Pick a date first');return false}let dates=[z.date];
if(z.rep){if(!z.days.length){toast('Pick at least one weekday');return false}dates=[];const st=pd(z.date),w=Math.max(1,Math.min(52,+z.weeks||8));for(let i=0;i<w*7;i++){const d=addD(st,i);if(z.days.includes(d.getDay()))dates.push(iso(d))}}
let c=0;dates.forEach(d=>{if(!S.se.some(s=>s.date===d&&s.rid===z.rid)){S.se.push({id:uid(),rid:z.rid,date:d,time:z.time||'',status:'planned'});c++}});
z.ok=true;z.count=c;V.sel=z.date;const d=pd(z.date);V.mo=new Date(d.getFullYear(),d.getMonth(),1)},
stat(el){const s=S.se.find(x=>x.id===el.dataset.id),v=el.dataset.v;if(s)s.status=s.status===v?'planned':v},
delse(el){S.se=S.se.filter(s=>s.id!==el.dataset.id)},
move(el){const v=$('#mv'+el.dataset.id).value,s=S.se.find(x=>x.id===el.dataset.id);if(s&&v){s.date=v;V.sel=v;const d=pd(v);V.mo=new Date(d.getFullYear(),d.getMonth(),1);toast('Workout moved')}},
rf(el){V.rf=el.dataset.v},
newrt(){const r={id:uid(),n:'New routine',desc:'',color:KC[S.rt.length%5],items:[]};S.rt.push(r);V.rid=r.id;V.scr='builder';V.sheet=null;scrollTo(0,0)},
edrt(el){V.rid=el.dataset.id;V.scr='builder';scrollTo(0,0)},
bdone(){V.scr='routines';toast('Routine saved','Your changes are ready for the next workout.')},
dup(el){const r=rtOf(el.dataset.id);S.rt.push({...r,id:uid(),n:r.n+' copy',items:r.items.map(i=>({...i}))});toast('Routine duplicated','“'+esc(r.n)+' copy” is ready to edit.')},
delrt(el){const id=el.dataset.id;if(V.cf!==id){V.cf=id;return}S.rt=S.rt.filter(r=>r.id!==id);S.se=S.se.filter(s=>s.rid!==id);V.cf='';V.scr='routines'},
rcol(el){rtOf(V.rid).color=el.dataset.c},
pick(){V.sheet={t:'pick',sel:[],q:'',f:'All'}},
ptog(el){const z=V.sheet,id=el.dataset.id;z.sel=z.sel.includes(id)?z.sel.filter(x=>x!==id):[...z.sel,id];$('#pl').innerHTML=pickList();$('#pc').textContent=z.sel.length;return false},
pchip(el){V.sheet.f=el.dataset.v},
paddsel(){const r=rtOf(V.rid);V.sheet.sel.forEach(id=>{const e=exOf(id);if(e){e.used=Date.now();r.items.push({eid:id,sets:e.sets,reps:e.reps,wt:e.wt||'',rest:e.rest||60,ss:false})}});V.sheet=null},
up(el){const a=rtOf(V.rid).items,k=+el.dataset.k;if(k>0)[a[k-1],a[k]]=[a[k],a[k-1]]},
dn(el){const a=rtOf(V.rid).items,k=+el.dataset.k;if(k<a.length-1)[a[k+1],a[k]]=[a[k],a[k+1]]},
rmi(el){rtOf(V.rid).items.splice(+el.dataset.k,1)},
ss(el){const i=rtOf(V.rid).items[+el.dataset.k];i.ss=!i.ss},
lf(el){V.f=el.dataset.v},clr(){V.q='';V.f='All'},
fav(el){const e=exOf(el.dataset.id);e.fav=!e.fav},
newex(){V.xf={id:'',n:'',eq:EQ[0],mu:MU[0],sec:'',type:'',sets:3,reps:'10',wt:'',rest:60,tb:false};V.scr='exform';scrollTo(0,0)},
edex(el){const e=exOf(el.dataset.id);V.xf={...e,tb:/sec|min/i.test(e.reps)};V.scr='exform';scrollTo(0,0)},
sec(el){const m=el.dataset.m,a=(V.xf.sec||'').split(', ').filter(Boolean);V.xf.sec=(a.includes(m)?a.filter(x=>x!==m):[...a,m]).join(', ')},
savex(){const x=V.xf,n=(x.n||'').trim();if(!n){toast('Add a name first','Every exercise needs a name.');return false}
const o={n,eq:x.eq,mu:x.mu,sec:(x.sec||'').split(', ').filter(m=>m&&m!==x.mu).join(', '),type:x.type,sets:+x.sets||3,reps:String(x.reps||'10').trim(),wt:x.wt===''?'':+x.wt,rest:+x.rest||60};
if(x.id)Object.assign(exOf(x.id),o);else S.ex.push({id:uid(),fav:false,...o});V.scr='library';toast('Exercise saved','“'+esc(n)+'” is in your library.');scrollTo(0,0)},
parse(){const rows=parse(V.imp.notes);if(!rows.length){toast('No exercises found','Check the formatting tip and try again.');return false}V.imp.rows=rows;V.imp.step=2},
istep(el){V.imp.step=+el.dataset.n},
iact(el){V.imp.rows[+el.dataset.k].act=el.dataset.v},
impgo(){const st={add:0,merge:0,skip:0};V.imp.rows.forEach(r=>{if(r.act==='skip')st.skip++;else if(r.act==='merge'&&r.dup&&exOf(r.dup)){const o=exOf(r.dup);Object.assign(o,{eq:r.eq,mu:r.mu,sets:+r.sets||3,reps:String(r.reps),wt:r.wt===''?o.wt:+r.wt});st.merge++}else{S.ex.push({id:uid(),n:r.n.trim(),eq:r.eq,mu:r.mu,sec:'',type:'',sets:+r.sets||3,reps:String(r.reps),wt:r.wt===''?'':+r.wt,rest:60,fav:false});st.add++}});V.imp.st=st;V.imp.step=3},
unit(el){S.unit=el.dataset.v},
exp(){V.bk=JSON.stringify(S)},
rst(){try{const d=JSON.parse(V.bk);if(!Array.isArray(d.ex)||!Array.isArray(d.rt)||!Array.isArray(d.se))throw 0;S=d;toast('Data restored')}catch(e){toast('Not valid backup data','Paste text from Export data.');return false}},
start(el){const s=S.se.find(x=>x.id===el.dataset.id),r=rtOf(s.rid),its=items(r);if(!its.length){toast('Add exercises first','This routine is empty.');return false}
V.sess={sid:s.id,rid:r.id,ei:0,t0:Date.now(),sets:its.map(i=>[...Array(Math.max(1,+i.sets||1))].map(()=>({w:i.wt,r:(String(i.reps).match(/\d+/)||[''])[0],d:false})))};V.scr='session';scrollTo(0,0)},
sset(el){const s=V.sess.sets[V.sess.ei][+el.dataset.k];s.d=!s.d},
rest(el){stopT();let n=+el.dataset.s;const tx=()=>{const e=$('#rtx');if(e)e.textContent=n>0?'Resting · '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):'Rest over. Next set!'};tx();V.tm=setInterval(()=>{n--;tx();if(n<=0)stopT()},1000);return false},
snext(){stopT();const z=V.sess,its=items(rtOf(z.rid));if(z.ei<its.length-1){z.ei++;scrollTo(0,0)}else{V.sum={dur:Date.now()-z.t0,sets:z.sets.flat().filter(s=>s.d).length};V.scr='summary'}},
ssave(){const z=V.sess,its=items(rtOf(z.rid));its.forEach((i,k)=>{const d=z.sets[k].filter(s=>s.d);if(d.length){const l=d[d.length-1];S.log[i.eid]={w:l.w,r:l.r}}});const s=S.se.find(x=>x.id===z.sid);if(s)s.status='done';V.scr='today';V.sess=null;toast('Session saved','Nice work. It’s marked done on your calendar.');scrollTo(0,0)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.classList.contains('overlay')&&e.target!==el)return;const f=A[el.dataset.a];if(!f)return;if(f(el)!==false){save();render()}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f||t.type==='checkbox')return;const k=+t.dataset.k,v=t.value,r=V.rid&&rtOf(V.rid);
switch(f){
case'q':V.q=v;$('#lres').innerHTML=libList();return;
case'rq':V.rq=v;$('#rres').innerHTML=rtList();return;
case'pq':V.sheet.q=v;$('#pl').innerHTML=pickList();return;
case'sh:date':case'sh:time':case'sh:weeks':V.sheet[f.slice(3)]=v;return;
case'im:notes':V.imp.notes=v;return;
case'set:bk':V.bk=v;return;
case'set:name':S.name=v||'Athlete';break;
case'r:n':r.n=v;break;case'r:desc':r.desc=v;break;
case'i:sets':case'i:reps':case'i:wt':case'i:rest':r.items[k][f.slice(2)]=v;break;
case's:w':V.sess.sets[V.sess.ei][k].w=v;return;case's:r':V.sess.sets[V.sess.ei][k].r=v;return;
default:if(f.startsWith('x:')){V.xf[f.slice(2)]=v;return}
if(f.startsWith('im:')){const o=V.imp.rows[k],m=f.slice(3);if(o&&['n','eq','mu','sets','reps'].includes(m))o[m]=v;return}}
save()});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f;if(t.type!=='checkbox'||!f)return;if(f==='sh:rep'){V.sheet.rep=t.checked;render()}else if(f==='x:tb'){V.xf.tb=t.checked;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&V.sheet){V.sheet=null;render()}});
render();
</script>
<script>
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
